services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_PORT}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: ["./observability/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro"]
    ports: ["127.0.0.1:${OTEL_GRPC_PORT}:4317", "127.0.0.1:${OTEL_HTTP_PORT}:4318"]
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME}/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE}
    ports: ["127.0.0.1:${NEO4J_HTTP_PORT}:7474", "127.0.0.1:${NEO4J_BOLT_PORT}:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${DOCKER_NODE_ENV}
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      WEB_ORIGIN: ${DOCKER_WEB_ORIGIN}
      NEO4J_URI: ${DOCKER_NEO4J_URI}
      NEO4J_USERNAME: ${NEO4J_USERNAME}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: ${NEO4J_DATABASE}
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      AUDIT_REQUIRED: ${DOCKER_AUDIT_REQUIRED}
      AGENT_STRATEGY: ${AGENT_STRATEGY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_GENAI_API_KEY: ${GOOGLE_API_KEY}
      GRAPH_PAGE_SIZE: ${GRAPH_PAGE_SIZE}
      GRAPH_MAX_PAGE_SIZE: ${GRAPH_MAX_PAGE_SIZE}
      GRAPH_MAX_DEPTH: ${GRAPH_MAX_DEPTH}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${DOCKER_OTEL_EXPORTER_OTLP_ENDPOINT}
      TELEMETRY_PUBLIC_ENABLED: ${TELEMETRY_PUBLIC_ENABLED}
    depends_on:
      neo4j: { condition: service_healthy }
      postgres: { condition: service_healthy }
      otel-collector: { condition: service_started }
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy --schema /app/prisma/schema.prisma && exec node dist/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports: ["${API_PORT}:${API_PORT}"]
  web:
    init: true
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
    ports: ["${WEB_PORT}:8080"]
volumes:
  neo4j_data:
  postgres_data:
