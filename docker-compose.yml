services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: local-postgres-password
      POSTGRES_DB: knowledge
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 20
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/local-development-password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:8080
      NEO4J_URI: neo4j://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: local-development-password
      NEO4J_DATABASE: neo4j
      DATABASE_URL: postgresql://knowledge:local-postgres-password@postgres:5432/knowledge?schema=public
      AUDIT_REQUIRED: "true"
      AGENT_STRATEGY: ${AGENT_STRATEGY:-mock}
      GOOGLE_GENAI_API_KEY: ${GOOGLE_GENAI_API_KEY:-}
    depends_on:
      neo4j: { condition: service_healthy }
      postgres: { condition: service_healthy }
    command: ["sh", "-c", "npx prisma migrate deploy --schema /app/prisma/schema.prisma && node dist/server.js"]
    ports: ["3000:3000"]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args: { VITE_API_URL: "http://localhost:3000" }
    depends_on: [api]
    ports: ["8080:80"]
volumes:
  neo4j_data:
  postgres_data:
